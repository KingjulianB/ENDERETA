[project]
name = "enderata"
version = "0.1.0"
description = "ENDERETA geospatial addressing pipeline (Huambo POC)"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0",
    "geopandas>=0.14",
    "osmnx>=1.9",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "psycopg2-binary>=2.9",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
