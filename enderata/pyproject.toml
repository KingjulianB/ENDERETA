[project]
name = "enderata"
version = "0.1.0"
description = "ENDERETA geospatial addressing pipeline (Huambo POC)"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0",
    "geopandas>=0.14",
    "osmnx>=1.9",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "psycopg2-binary>=2.9",
    "flask>=3.0",
    "rasterio>=1.3",
    "pystac-client>=0.8",
    "Pillow>=10.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Local training only -- NOT part of the add-on's Docker build. See
# requirements-ml.txt for CUDA-specific install instructions.
ml = ["torch>=2.14"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
